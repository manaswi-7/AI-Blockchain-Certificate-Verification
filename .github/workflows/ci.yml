name: Project CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend - Maven test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Maven tests
        run: mvn -B test

  ai-service:
    name: AI service - Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system OCR dependency
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Check FastAPI app import
        run: python -c "from app import app; print('FastAPI app import OK')"

  frontend:
    name: Frontend - Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build

  blockchain:
    name: Blockchain - Hardhat compile and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Compile contracts
        run: npx hardhat compile
      - name: Run contract tests
        run: npx hardhat test

  dataset:
    name: Certificate dataset pipeline - end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certificate_generation
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dataset dependencies
        run: pip install -r requirements.txt
      - name: Compile dataset scripts
        run: python -m compileall -q .
      - name: Generate a smoke-test dataset
        run: python generate_500_certificate_dataset.py --count 20
      - name: Validate image pairs and split
        run: |
          python split_dataset.py
          python -c "from pathlib import Path; from PIL import Image; root=Path('dataset'); real=sorted((root/'real').glob('*.png')); tampered=sorted((root/'tampered').glob('*.png')); assert len(real)==20 and len(tampered)==20; assert all(Image.open(p).size==(2048,1447) for p in real+tampered); print('Dataset smoke test OK: 20 pairs, 2048x1447')"
      - name: Clean smoke-test artifacts
        if: always()
        run: rm -rf dataset
