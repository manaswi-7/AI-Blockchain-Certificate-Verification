name: Deploy CertificateRegistry to Polygon Amoy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "blockchain/**"
      - ".github/workflows/deploy-amoy.yml"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate deployment secrets
        env:
          POLYGON_AMOY_RPC_URL: ${{ secrets.POLYGON_AMOY_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$POLYGON_AMOY_RPC_URL" ]; then
            echo "ERROR: GitHub Actions secret POLYGON_AMOY_RPC_URL is missing."
            exit 1
          fi

          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "ERROR: GitHub Actions secret DEPLOYER_PRIVATE_KEY is missing."
            exit 1
          fi

          if ! echo "$DEPLOYER_PRIVATE_KEY" | grep -Eq '^0x[0-9a-fA-F]{64}$'; then
            echo "ERROR: DEPLOYER_PRIVATE_KEY must be a 32-byte hexadecimal private key beginning with 0x."
            exit 1
          fi

          echo "Deployment secrets are present and the private-key format is valid."

      - name: Compile contract
        run: npx hardhat compile

      - name: Deploy CertificateRegistry
        run: npx hardhat run scripts/deploy.js --network amoy
        env:
          POLYGON_AMOY_RPC_URL: ${{ secrets.POLYGON_AMOY_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
