name: Deploy CertificateRegistry to Polygon Amoy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "blockchain/**"
      - ".github/workflows/deploy-amoy.yml"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compile contract
        run: npx hardhat compile

      - name: Deploy CertificateRegistry
        run: npx hardhat run scripts/deploy.js --network amoy
        env:
          POLYGON_AMOY_RPC_URL: ${{ secrets.POLYGON_AMOY_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
