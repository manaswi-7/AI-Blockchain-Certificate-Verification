name: Train certificate tampering model

on:
  push:
    paths:
      - "certificate_generation/**"
      - ".github/workflows/train-ai-model.yml"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of genuine/tampered certificate pairs"
        required: false
        default: "500"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.18.0 pillow==11.1.0 qrcode==8.0 numpy==2.0.2

      - name: Generate genuine and tampered certificates
        working-directory: certificate_generation
        run: |
          python generate_500_certificate_dataset.py --count ${{ inputs.count }}

      - name: Split dataset without certificate-pair leakage
        working-directory: certificate_generation
        run: python split_dataset.py --seed 42

      - name: Train and evaluate MobileNetV2 tamper model
        working-directory: certificate_generation
        run: python train_tamper_model.py

      - name: Verify model output
        run: |
          test -f certificate_generation/models/certificate_tamper_model.keras
          test -f certificate_generation/models/test_metrics.json
          cp certificate_generation/models/certificate_tamper_model.keras ai-service/models/certificate_tamper_model.keras
          cp certificate_generation/models/test_metrics.json ai-service/models/test_metrics.json

      - name: Prepare lightweight Vercel model
        run: |
          python - <<'PY'
          import tensorflow as tf
          from pathlib import Path
          model = tf.keras.models.load_model("certificate_generation/models/certificate_tamper_model.keras", compile=False)
          converter = tf.lite.TFLiteConverter.from_keras_model(model)
          converter.optimizations = [tf.lite.Optimize.DEFAULT]
          out = Path("frontend/models/certificate_tamper_model.tflite")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(converter.convert())
          print(f"Created {out}: {out.stat().st_size} bytes")
          PY
          test -s frontend/models/certificate_tamper_model.tflite

      - name: Commit trained model to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-service/models/certificate_tamper_model.keras ai-service/models/test_metrics.json
          git diff --cached --quiet && exit 0
          git commit -m "Add trained certificate tampering model"
          git push
