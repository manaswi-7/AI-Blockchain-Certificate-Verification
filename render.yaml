services:
  - type: web
    name: certichain-ai
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: certichain-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: FRONTEND_URL
        value: https://ai-blockchain-certificate-verificat.vercel.app
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: certichain-ai
          property: host
      - key: VERIFICATION_URL
        value: https://ai-blockchain-certificate-verificat.vercel.app/verify
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SETUP_KEY
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: BLOCKCHAIN_CHAIN_ID
        value: "80002"
